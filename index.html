<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小隊抽獎系統</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1226">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小隊抽獎">
<style>
  :root {
    --bg: #0f1226;
    --card: #1b2040;
    --card2: #232a52;
    --accent: #ffd45e;
    --accent2: #ff7a59;
    --text: #f4f6ff;
    --muted: #9aa3cf;
    --ok: #4ade80;
    --full: #64708f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #2a2f66 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 780px; margin: 0 auto; position: relative; }
  h1 {
    text-align: center;
    font-size: 26px;
    margin: 8px 0 4px;
    letter-spacing: 2px;
  }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 14px; }

  /* 剩餘名額 */
  .quota-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  .quota {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 2px solid transparent;
    transition: .25s;
  }
  .quota.full { opacity: .5; border-color: var(--full); }
  .quota .name { font-size: 17px; font-weight: 700; }
  .quota .count { font-size: 14px; color: var(--muted); }
  .quota .count b { color: var(--accent); font-size: 22px; }
  .quota.full .count b { color: var(--full); }
  .quota .members { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 14px; }

  /* 抽獎區 */
  .stage {
    background: linear-gradient(160deg, var(--card2), var(--card));
    border-radius: 22px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    margin-bottom: 22px;
  }
  .picker-label { color: var(--muted); font-size: 14px; margin-bottom: 10px; }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .team-btn {
    padding: 12px 4px;
    font-size: 16px;
    font-weight: 700;
    border: 2px solid #39406e;
    border-radius: 12px;
    background: #10142e;
    color: var(--text);
    cursor: pointer;
    line-height: 1.25;
    transition: .12s;
  }
  .team-btn small { display: block; font-size: 11px; font-weight: 500; margin-top: 2px; }
  .team-btn:active { transform: scale(.96); }
  .team-btn.selected {
    border-color: var(--accent);
    background: linear-gradient(160deg, #33306a, #26264f);
    box-shadow: 0 0 0 2px rgba(255,212,94,.35);
  }
  .team-btn.done {
    opacity: .5;
    cursor: default;
    border-color: transparent;
    color: var(--muted);
  }
  .team-btn.done small { color: var(--ok); }
  .team-grid.locked { pointer-events: none; opacity: .6; }

  select {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border-radius: 14px;
    border: none;
    background: #10142e;
    color: var(--text);
    text-align: center;
    text-align-last: center;
    margin-bottom: 16px;
    -webkit-appearance: none;
    appearance: none;
  }
  select:disabled { opacity: .5; }

  .reel {
    font-size: 40px;
    font-weight: 800;
    min-height: 72px;
    line-height: 72px;
    margin: 10px 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 3px;
    transform-origin: center;
  }
  .reel.win {
    font-size: 60px;
    animation: reelPop .6s cubic-bezier(.18,1.5,.4,1) both;
    filter: drop-shadow(0 4px 18px rgba(255,180,70,.55));
  }
  @keyframes reelPop {
    0%   { transform: scale(.3);  opacity: 0; }
    55%  { transform: scale(1.3); opacity: 1; }
    75%  { transform: scale(.92); }
    100% { transform: scale(1); }
  }

  #confetti {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50;
  }
  .result-note { color: var(--muted); font-size: 14px; min-height: 20px; margin-bottom: 14px; }

  button.draw {
    width: 100%;
    padding: 18px;
    font-size: 22px;
    font-weight: 800;
    border: none;
    border-radius: 16px;
    color: #201400;
    background: linear-gradient(90deg, var(--accent), #ffb454);
    cursor: pointer;
    letter-spacing: 4px;
    box-shadow: 0 8px 24px rgba(255,180,70,.35);
    transition: transform .1s;
  }
  button.draw:active { transform: scale(.98); }
  button.draw:disabled {
    background: #3a4066; color: var(--muted);
    box-shadow: none; cursor: not-allowed;
  }

  .footer { display: flex; gap: 12px; margin-top: 4px; }
  .footer button {
    flex: 1;
    padding: 12px;
    font-size: 14px;
    border-radius: 12px;
    border: 1px solid #39406e;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .footer button:active { background: #262c52; }

  /* 已抽名單 */
  .log { margin-top: 22px; }
  .log h2 { font-size: 16px; color: var(--muted); margin: 0 0 10px; text-align: center; }
  .log-row {
    display: flex; justify-content: space-between;
    background: var(--card); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px; font-size: 15px;
  }
  .log-row .dest { color: var(--accent); font-weight: 700; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 10px; }

  /* 後台齒輪 */
  #adminGear {
    position: absolute;
    top: 18px; right: 16px;
    background: rgba(255,255,255,.06);
    border: none; color: var(--text);
    font-size: 20px; width: 40px; height: 40px;
    border-radius: 50%; cursor: pointer;
  }
  #adminGear:active { background: rgba(255,255,255,.15); }

  /* Modal */
  .modal-mask {
    display: none;
    position: fixed; inset: 0;
    background: rgba(6,8,20,.72);
    backdrop-filter: blur(3px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-mask.open { display: flex; }
  .modal {
    position: relative;
    background: var(--card);
    border-radius: 20px;
    padding: 24px 20px;
    width: 100%; max-width: 460px;
    max-height: 86vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h2 { margin: 0 0 16px; font-size: 20px; text-align: center; }
  .modal-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer;
  }
  .modal input[type=password] {
    width: 100%; padding: 14px; font-size: 18px;
    border-radius: 12px; border: none;
    background: #10142e; color: var(--text);
    text-align: center; margin-bottom: 10px;
  }
  .modal-err { color: var(--accent2); font-size: 14px; min-height: 20px; text-align: center; }
  .modal-primary {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 700;
    border: none; border-radius: 12px; cursor: pointer;
    color: #201400; background: linear-gradient(90deg, var(--accent), #ffb454);
  }
  .modal-ghost {
    padding: 14px; font-size: 14px;
    border: 1px solid #39406e; border-radius: 12px;
    background: transparent; color: var(--muted); cursor: pointer;
    white-space: nowrap;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .modal-primary { flex: 1; }
  .admin-hint { color: var(--muted); font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .admin-summary {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 14px; font-size: 12px;
  }
  .admin-summary span {
    background: #10142e; padding: 5px 9px; border-radius: 8px; color: var(--muted);
  }
  .admin-summary span.over { color: var(--accent2); border: 1px solid var(--accent2); }
  .admin-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid #2a3157;
  }
  .admin-row span { font-size: 15px; }
  .admin-row select {
    width: 46%; padding: 9px; font-size: 15px;
    border-radius: 10px; border: none; margin: 0;
    background: #10142e; color: var(--text);
  }

  @media (max-width: 480px) {
    .quota-grid { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
    .reel { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <button id="adminGear" title="後台" aria-label="後台">⚙️</button>
  <h1>🎉 小隊抽獎系統</h1>
  <div class="subtitle">十個小隊，抽出前往的地點</div>

  <div class="quota-grid" id="quotaGrid"></div>

  <div class="stage">
    <div class="picker-label">選擇要抽獎的小隊</div>
    <div class="team-grid" id="teamGrid"></div>
    <div class="reel" id="reel">？？？</div>
    <div class="result-note" id="note">請選擇小隊後按下抽獎</div>
    <button class="draw" id="drawBtn">開 始 抽 獎</button>
    <div class="footer">
      <button id="soundBtn">🔊 音效開</button>
      <button id="resetBtn">重置全部</button>
    </div>
    <div style="text-align:center;font-size:12px;opacity:.6;margin-top:10px"><a href="https://kaikai.web.app/?from=lottery" target="_blank" rel="noopener" style="color:inherit">製作：楷楷 KAIKAI</a></div>
  </div>

  <div class="log">
    <h2>抽獎結果</h2>
    <div id="logList"></div>
  </div>
</div>

<canvas id="confetti"></canvas>

<!-- 後台 Modal -->
<div class="modal-mask" id="adminMask">
  <div class="modal">
    <button class="modal-close" id="adminClose">✕</button>

    <!-- 登入 -->
    <div id="adminLogin">
      <h2>後台登入</h2>
      <input type="password" id="adminPwd" inputmode="numeric" placeholder="請輸入密碼" autocomplete="off">
      <div class="modal-err" id="adminErr"></div>
      <button class="modal-primary" id="adminLoginBtn">登入</button>
    </div>

    <!-- 設定 -->
    <div id="adminPanel" style="display:none">
      <h2>指定抽獎結果</h2>
      <div class="admin-hint">設「隨機」＝正常抽獎；指定地點後，該小隊轉盤會固定落在指定地點。</div>
      <div id="adminSummary" class="admin-summary"></div>
      <div id="adminRows"></div>
      <div class="modal-actions">
        <button class="modal-ghost" id="adminClearAssign">清除所有指定</button>
        <button class="modal-primary" id="adminSaveBtn">儲存</button>
      </div>
    </div>
  </div>
</div>


<script>
  // ===== 設定 =====
  const TEAMS = ["第一小隊","第二小隊","第三小隊","第四小隊","第五小隊",
                 "第六小隊","第七小隊","第八小隊","第九小隊","第十小隊"];
  const DESTS = [
    { name: "中街",     quota: 2 },
    { name: "溪湖糖廠", quota: 3 },
    { name: "東螺溪",   quota: 3 },
    { name: "葡萄園",   quota: 2 },
  ];
  const STORE_KEY = "team-lottery-v1";
  const ASSIGN_KEY = "team-lottery-assign-v1";
  const ADMIN_PWD = "0000";   // ← 後台密碼，要改這裡

  // ===== 狀態 =====
  // results: { 小隊名稱: 地點名稱 }
  let results = load(STORE_KEY);
  // assignments: { 小隊名稱: 指定地點名稱 }（後台指定，未指定則無此鍵）
  let assignments = load(ASSIGN_KEY);

  function load(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(results)); }
  function saveAssign() { localStorage.setItem(ASSIGN_KEY, JSON.stringify(assignments)); }

  // ===== 音效（Web Audio，即時合成、免音檔、可離線）=====
  let audioCtx = null;
  let soundOn = localStorage.getItem("team-lottery-sound") !== "off";

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  // 單一音符
  function tone(freq, start, dur, { type = "square", vol = 0.2 } = {}) {
    if (!soundOn || !audioCtx) return;
    const t = audioCtx.currentTime + start;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  // 轉盤每格「答」聲，pitch 隨進度略升
  function tickSound(progress) {
    tone(700 + progress * 500, 0, 0.04, { type: "square", vol: 0.09 });
  }
  // 中獎小號聲
  function fanfare() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
      tone(f, i * 0.11, 0.34, { type: "triangle", vol: 0.28 })
    );
  }

  // ===== 彩帶特效（canvas，純合成、離線可用）=====
  const confettiCanvas = document.getElementById("confetti");
  const cctx = confettiCanvas.getContext("2d");
  let confetti = [];
  let confettiRAF = null;

  function resizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeConfetti);
  resizeConfetti();

  function burstConfetti() {
    const colors = ["#ffd45e", "#ff7a59", "#4ade80", "#60a5fa", "#f472b6", "#ffffff"];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight * 0.34;
    for (let i = 0; i < 150; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 4 + Math.random() * 11;
      confetti.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 6,
        g: 0.28 + Math.random() * 0.15,
        w: 6 + Math.random() * 7,
        h: 4 + Math.random() * 5,
        color: colors[i % colors.length],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.35,
        life: 1
      });
    }
    if (!confettiRAF) confettiRAF = requestAnimationFrame(stepConfetti);
  }

  function stepConfetti() {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confetti.forEach(p => {
      p.vy += p.g; p.vx *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.life -= 0.007;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.globalAlpha = Math.max(0, p.life);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cctx.restore();
    });
    confetti = confetti.filter(p => p.life > 0 && p.y < confettiCanvas.height + 40);
    if (confetti.length) {
      confettiRAF = requestAnimationFrame(stepConfetti);
    } else {
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiRAF = null;
    }
  }

  // 各地點剩餘名額
  function remaining() {
    const used = {};
    DESTS.forEach(d => used[d.name] = 0);
    Object.values(results).forEach(dest => { if (used[dest] != null) used[dest]++; });
    const rem = {};
    DESTS.forEach(d => rem[d.name] = d.quota - used[d.name]);
    return rem;
  }
  // 該地點已分配的小隊
  function membersOf(destName) {
    return Object.keys(results).filter(t => results[t] === destName);
  }

  // ===== 畫面 =====
  const quotaGrid = document.getElementById("quotaGrid");
  const teamGrid = document.getElementById("teamGrid");
  const reel = document.getElementById("reel");
  const note = document.getElementById("note");
  const drawBtn = document.getElementById("drawBtn");
  const resetBtn = document.getElementById("resetBtn");
  const logList = document.getElementById("logList");

  let spinning = false;
  let selectedTeam = null;   // 目前選取的小隊

  function renderQuota() {
    const rem = remaining();
    quotaGrid.innerHTML = "";
    DESTS.forEach(d => {
      const left = rem[d.name];
      const el = document.createElement("div");
      el.className = "quota" + (left <= 0 ? " full" : "");
      el.innerHTML = `
        <div>
          <div class="name">${d.name}</div>
          <div class="members">${membersOf(d.name).join("、") || "—"}</div>
        </div>
        <div class="count">剩餘 <b>${left}</b> / ${d.quota}</div>`;
      quotaGrid.appendChild(el);
    });
  }

  function renderTeamGrid() {
    // 若目前選取的隊已抽過或未設定，預設跳到第一個尚未抽的小隊
    if (!selectedTeam || results[selectedTeam]) {
      selectedTeam = TEAMS.find(t => !results[t]) || null;
    }
    teamGrid.innerHTML = "";
    TEAMS.forEach((t, i) => {
      const done = results[t];
      const btn = document.createElement("button");
      btn.className = "team-btn" +
        (done ? " done" : "") +
        (t === selectedTeam ? " selected" : "");
      btn.innerHTML = `第${i + 1}隊${done ? `<small>${done}</small>` : ""}`;
      if (!done) {
        btn.addEventListener("click", () => selectTeam(t));
      }
      teamGrid.appendChild(btn);
    });
    updateDrawBtn();
  }

  function selectTeam(t) {
    if (spinning || results[t]) return;
    selectedTeam = t;
    reel.classList.remove("win");
    reel.textContent = "？？？";
    note.textContent = "請按下抽獎";
    renderTeamGrid();
  }

  function renderLog() {
    const drawn = TEAMS.filter(t => results[t]);
    if (drawn.length === 0) {
      logList.innerHTML = `<div class="empty">尚未有抽獎結果</div>`;
      return;
    }
    logList.innerHTML = drawn.map(t =>
      `<div class="log-row"><span>${t}</span><span class="dest">${results[t]}</span></div>`
    ).join("");
  }

  function updateDrawBtn() {
    const allDone = TEAMS.every(t => results[t]);
    const disabled = spinning || allDone || !selectedTeam || !!results[selectedTeam];
    drawBtn.disabled = disabled;
    if (allDone) drawBtn.textContent = "全部抽完 🎊";
    else drawBtn.textContent = "開 始 抽 獎";
  }

  function renderAll() { renderQuota(); renderTeamGrid(); renderLog(); }

  // ===== 抽獎 =====
  function draw() {
    if (spinning) return;
    const team = selectedTeam;
    if (!team || results[team]) return;
    ensureAudio();  // 使用者手勢中解鎖音訊
    reel.classList.remove("win");

    const rem = remaining();
    const pool = DESTS.filter(d => rem[d.name] > 0).map(d => d.name);
    const rigged = assignments[team];  // 後台指定地點（可能未指定）

    let finalDest;
    if (rigged) {
      finalDest = rigged;              // 後台指定：直接鎖定，不受剩餘名額限制
    } else {
      if (pool.length === 0) { note.textContent = "名額已滿，無法再抽"; return; }
      finalDest = pool[Math.floor(Math.random() * pool.length)];
    }

    // 轉盤動畫用的候選（偽裝），確保包含最終地點
    const animPool = pool.length ? pool.slice() : DESTS.map(d => d.name);
    if (!animPool.includes(finalDest)) animPool.push(finalDest);

    spinning = true;
    updateDrawBtn();
    teamGrid.classList.add("locked");
    resetBtn.disabled = true;
    note.textContent = `${team} 抽獎中…`;

    // 轉盤動畫：逐漸變慢
    let ticks = 0;
    const totalTicks = 22 + Math.floor(Math.random() * 8);
    let delay = 45;
    function tick() {
      reel.textContent = animPool[Math.floor(Math.random() * animPool.length)];
      tickSound(ticks / totalTicks);
      ticks++;
      if (ticks >= totalTicks) {
        finish(team, finalDest);
        return;
      }
      if (ticks > totalTicks - 8) delay += 35; // 尾段變慢
      setTimeout(tick, delay);
    }
    tick();
  }

  function finish(team, dest) {
    reel.textContent = dest;
    reel.classList.remove("win");
    void reel.offsetWidth;        // 重觸發動畫
    reel.classList.add("win");
    fanfare();
    burstConfetti();
    results[team] = dest;
    save();
    spinning = false;
    selectedTeam = null;   // 自動跳到下一個未抽的小隊
    teamGrid.classList.remove("locked");
    resetBtn.disabled = false;
    note.textContent = `🎊 ${team} → ${dest}！`;
    renderAll();
  }

  // ===== 事件 =====
  drawBtn.addEventListener("click", draw);

  const soundBtn = document.getElementById("soundBtn");
  function renderSoundBtn() { soundBtn.textContent = soundOn ? "🔊 音效開" : "🔇 音效關"; }
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    localStorage.setItem("team-lottery-sound", soundOn ? "on" : "off");
    renderSoundBtn();
    if (soundOn) { ensureAudio(); tone(880, 0, 0.12, { type: "triangle", vol: 0.25 }); } // 試聽
  });
  renderSoundBtn();
  resetBtn.addEventListener("click", () => {
    if (spinning) return;
    if (!confirm("確定要清除所有抽獎結果嗎？")) return;
    results = {};
    save();
    reel.textContent = "？？？";
    note.textContent = "已重置，請選擇小隊後按下抽獎";
    renderAll();
  });

  // ===== 後台 =====
  const adminGear = document.getElementById("adminGear");
  const adminMask = document.getElementById("adminMask");
  const adminClose = document.getElementById("adminClose");
  const adminLogin = document.getElementById("adminLogin");
  const adminPanel = document.getElementById("adminPanel");
  const adminPwd = document.getElementById("adminPwd");
  const adminErr = document.getElementById("adminErr");
  const adminLoginBtn = document.getElementById("adminLoginBtn");
  const adminRows = document.getElementById("adminRows");
  const adminSummary = document.getElementById("adminSummary");
  const adminSaveBtn = document.getElementById("adminSaveBtn");
  const adminClearAssign = document.getElementById("adminClearAssign");

  function openAdmin() {
    adminMask.classList.add("open");
    adminLogin.style.display = "";
    adminPanel.style.display = "none";
    adminPwd.value = "";
    adminErr.textContent = "";
    setTimeout(() => adminPwd.focus(), 50);
  }
  function closeAdmin() { adminMask.classList.remove("open"); }

  function tryLogin() {
    if (adminPwd.value === ADMIN_PWD) {
      adminLogin.style.display = "none";
      adminPanel.style.display = "";
      renderAdminPanel();
    } else {
      adminErr.textContent = "密碼錯誤";
      adminPwd.value = "";
      adminPwd.focus();
    }
  }

  function renderAdminSummary() {
    const count = {};
    DESTS.forEach(d => count[d.name] = 0);
    Object.values(assignments).forEach(dest => { if (count[dest] != null) count[dest]++; });
    adminSummary.innerHTML = DESTS.map(d => {
      const over = count[d.name] > d.quota;
      return `<span class="${over ? "over" : ""}">${d.name} 指定 ${count[d.name]}/${d.quota}</span>`;
    }).join("");
  }

  function renderAdminPanel() {
    adminRows.innerHTML = "";
    TEAMS.forEach(t => {
      const row = document.createElement("div");
      row.className = "admin-row";
      const drawn = results[t] ? `（已抽：${results[t]}）` : "";
      const opts = ['<option value="">隨機</option>']
        .concat(DESTS.map(d =>
          `<option value="${d.name}" ${assignments[t] === d.name ? "selected" : ""}>${d.name}</option>`))
        .join("");
      row.innerHTML = `<span>${t}<small style="color:var(--muted)">${drawn}</small></span>
                       <select data-team="${t}">${opts}</select>`;
      adminRows.appendChild(row);
    });
    adminRows.querySelectorAll("select").forEach(sel => {
      sel.addEventListener("change", () => {
        const team = sel.getAttribute("data-team");
        if (sel.value) assignments[team] = sel.value;
        else delete assignments[team];
        renderAdminSummary();
      });
    });
    renderAdminSummary();
  }

  adminGear.addEventListener("click", openAdmin);
  adminClose.addEventListener("click", closeAdmin);
  adminMask.addEventListener("click", e => { if (e.target === adminMask) closeAdmin(); });
  adminLoginBtn.addEventListener("click", tryLogin);
  adminPwd.addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
  adminSaveBtn.addEventListener("click", () => {
    saveAssign();
    closeAdmin();
    renderAll();
    note.textContent = "後台設定已儲存";
  });
  adminClearAssign.addEventListener("click", () => {
    if (!confirm("確定清除所有『指定』設定嗎？（不影響已抽結果）")) return;
    assignments = {};
    saveAssign();
    renderAdminPanel();
  });

  // ===== 啟動 =====
  renderAll();

  // ===== 註冊 Service Worker（離線）=====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
